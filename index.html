  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      linear-gradient(rgba(0,0,0,.68), rgba(0,0,0,.68)),
      var(--photo) center 65% / cover no-repeat fixed,
      var(--bg);
    color: var(--fg);
    font-family: "Quicksand", "Nunito", "Varela Round", sans-serif;
  }

  /* ---------- Layout: del compositor centrat al xat ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: var(--pad);
  }

  .spacer-top    { flex: 1 1 0; }
  .spacer-bottom { flex: 1.15 1 0; }
  .thread        { flex: 0 1 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  .spacer-top, .spacer-bottom, .thread { transition: flex-grow .7s var(--ease); }

  .app[data-state="chat"] .spacer-top,
  .app[data-state="chat"] .spacer-bottom { flex-grow: 0; }
  .app[data-state="chat"] .thread        { flex-grow: 1; margin-bottom: .75rem; }

  .thread-inner {
    width: min(720px, 100%);
    margin: 0 auto;
    padding-block: .5rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  .dock {
    flex: none;
    width: min(720px, 100%);
    margin-inline: auto;
  }

  /* ---------- Compositor ---------- */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: .5rem;
    padding: .6rem .6rem .6rem 1.35rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 24px;
    transition: border-color .25s ease;
    animation: rise .9s var(--ease) .1s both;
  }
  .composer:focus-within { border-color: rgba(255, 255, 255, .7); }

  textarea {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    color: var(--fg);
    font: 400 clamp(1.05rem, 1.8vw, 1.25rem) / 1.5 "Quicksand", "Nunito", sans-serif;
    padding: .6rem 0;
    max-height: 9rem;
  }
  textarea::placeholder { color: #9a9a9a; }

  .send {
    position: relative;
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 16px;
    background: var(--fg);
    color: var(--bg);
    cursor: pointer;
    transition: opacity .25s ease, transform .25s var(--ease);
  }
  .send:disabled { opacity: .25; cursor: default; }
  .send:not(:disabled):hover { transform: translateY(-2px); }
  .send > svg { width: 22px; height: 22px; }

  /* Insígnia de WhatsApp: avisa que l'enviament sortirà de la web */
  .wa-badge {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #25D366;
    box-shadow: 0 0 0 2px #141414;
    opacity: 0;
    transform: scale(.4);
    pointer-events: none;
    transition: opacity .25s ease, transform .35s var(--ease);
  }
  .wa-badge svg { width: 13px; height: 13px; fill: #fff; }
  .send.wa .wa-badge { opacity: 1; transform: scale(1); }

  /* ---------- Prompts predefinits ---------- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .6rem;
    margin-top: 1rem;
  }

  .chip {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: .06em;
    color: var(--fg);
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 999px;
    padding: .5rem 1.2rem;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s var(--ease);
    animation: rise .8s var(--ease) calc(.35s + var(--i) * .08s) both;
  }
  .chip.late { animation-delay: calc(var(--i) * .12s); }
  .chip:hover { background: rgba(255, 255, 255, .14); border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip:focus-visible, .send:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* ---------- Missatges ---------- */
  .msg { animation: rise .6s var(--ease) both; }

  .msg.user { align-self: flex-end; max-width: min(80%, 34rem); }
  .bubble {
    background: rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 20px 20px 6px 20px;
    padding: .8rem 1.1rem;
    font-weight: 400;
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .who {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .6rem;
    font-family: "Oswald", sans-serif;
    font-weight: 500;
    font-size: .9rem;
    letter-spacing: .12em;
  }

  .avatar {
    width: 28px;
    height: 28px;
    flex: none;
    border-radius: 50%;
    background: var(--photo) 62.6% 32.2% / 350% no-repeat, #222;
    border: 1px solid rgba(255, 255, 255, .5);
  }
  .avatar.big { width: 64px; height: 64px; }

  .body { color: #e4e4e4; font-weight: 400; font-size: clamp(1rem, 1.6vw, 1.15rem); line-height: 1.6; }
  .body p + p { margin-top: .6rem; }
  .msg.center .who { justify-content: center; }
  .msg.center .body > p { text-align: center; }
  .body a { color: var(--fg); text-underline-offset: 4px; }

  /* Indicador d'escriptura */
  .typing { display: inline-flex; gap: 5px; padding-block: .5rem; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--fg);
    animation: blink 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }

  /* ---------- Gigs: feed estil Instagram ---------- */
  .feed {
    width: min(470px, 100%);
    margin: 1rem auto 0;
    background: rgba(8, 8, 8, .6);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 1.1rem 1.2rem;
    border-bottom: 1px solid var(--line);
  }
  .profile strong { display: block; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 1.25rem; letter-spacing: .04em; }
  .profile span.meta { display: block; color: var(--muted); font-size: .95rem; margin-top: .15rem; }

  .post { border-bottom: 1px solid var(--line); animation: rise .7s var(--ease) calc(var(--i) * .12s) both; }
  .post:last-child { border-bottom: 0; }

  .post-head { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; }
  .post-head .avatar { width: 34px; height: 34px; }
  .post-head > div { min-width: 0; }
  .post-head strong { display: block; font-weight: 500; font-size: .95rem; line-height: 1.2; }
  .post-head .go {
    margin-left: auto; flex: none;
    font-family: "Oswald", sans-serif; font-weight: 500; font-size: .85rem; letter-spacing: .08em;
    color: var(--fg); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 1px;
    transition: border-color .25s ease;
  }
  .post-head .go:hover { border-bottom-color: var(--fg); }
  .post-head .go:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .post-head small { display: block; color: var(--muted); font-size: .8rem; }

  .media { display: block; position: relative; overflow: hidden; cursor: pointer; }
  .media img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; user-select: none; -webkit-user-drag: none;
  }

  .tile {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.25rem;
    user-select: none;
    -webkit-user-select: none;
  }
  .tile-kicker { font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .1em; font-size: .85rem; text-transform: uppercase; opacity: .8; }
  .tile-title  { font-family: "Oswald", sans-serif; font-weight: 700; font-size: clamp(2rem, 9vw, 3.4rem); line-height: .95; letter-spacing: -.01em; text-transform: uppercase; }

  .tile-a { background: #fff; color: #000; }
  .tile-b { background-color: #0a0a0a;
            background-image:
              repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.1) 39px 40px),
              repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.1) 39px 40px); }
  .tile-c { background: radial-gradient(circle at 80% 20%, transparent 0 18%, rgba(255,255,255,.22) 18.4% 19%, transparent 19.4% 34%, rgba(255,255,255,.16) 34.4% 35%, transparent 35.4% 52%, rgba(255,255,255,.1) 52.4% 53%, transparent 53.4%), #151515; }
  .tile-d { background: #d9d9d9; color: #000; }

  .heart-pop {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    opacity: 0; color: var(--fg); mix-blend-mode: difference;
  }
  .heart-pop svg { width: 96px; height: 96px; fill: currentColor; }
  .heart-pop.go { animation: pop .8s var(--ease); }

  .actions { display: flex; justify-content: space-between; padding: .6rem .8rem 0; }
  .act {
    background: none; border: 0; color: var(--fg); cursor: pointer; padding: .35rem; display: grid; place-items: center;
    transition: transform .25s var(--ease);
  }
  .act:hover { transform: scale(1.1); }
  .act:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .act svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: fill .2s ease; }
  .act[aria-pressed="true"] svg { fill: currentColor; }
  .act.like[aria-pressed="true"] svg { animation: pop-small .35s var(--ease); }

  .caption { padding: .4rem 1rem 1.2rem; font-size: .95rem; line-height: 1.5; color: #e4e4e4; }
  .caption .line { display: block; }
  .caption .line + .line { margin-top: .55rem; }
  .caption b { display: block; font-weight: 500; color: var(--fg); }
  .caption .meta { display: block; color: var(--muted); font-size: .88rem; }

  /* ---------- Milestones ---------- */
  .milestones { list-style: none; margin-top: 1rem; width: min(640px, 100%); }
  .milestones li {
    display: grid;
    grid-template-columns: clamp(5rem, 15vw, 7.5rem) 1fr;
    gap: 0 1.25rem;
    align-items: baseline;
    padding: 1.1rem 0;
    border-top: 1px solid var(--line);
    animation: rise .7s var(--ease) calc(var(--i) * .12s) both;
  }
  .milestones li:last-child { border-bottom: 1px solid var(--line); }
  .milestones .year { font-family: "Oswald", sans-serif; font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1; letter-spacing: -.01em; }
  .milestones .year.none { opacity: .35; }

  .milestones .note { display: block; color: var(--muted); font-size: 1rem; margin-top: .25rem; }

    display: grid;
    grid-template-columns: auto 1fr;
    gap: .35rem 1rem;
    margin-top: .9rem;
    font-size: .92rem;
    line-height: 1.45;
  }

    border-radius: 999px;
    padding: .4rem 1.1rem;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .ext:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .ext:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* ---------- Animacions ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 80%, 100% { opacity: .2; }
    40%           { opacity: 1; }
  }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(.4); }
    25%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1); }
  }
  @keyframes pop-small {
    0% { transform: scale(.7); } 60% { transform: scale(1.25); } 100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .spacer-top, .spacer-bottom, .thread { transition: none; }
    .composer, .chip, .msg, .post, .milestones li { animation-name: fade; }
    .typing i { animation-duration: 2.4s; }
    .heart-pop.go { animation: none; }
    .act:hover, .send:not(:disabled):hover { transform: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  ::selection { background: var(--fg); color: var(--bg); }
</style>

      await wait(900);
      location.href = TRENDS_URL;
      return;
    }

    if (action === "link") {
      body.innerHTML = "<p>" + PROMPTS[key].opening + "</p>";
      toBottom();
      await wait(900);
      location.href = PROMPTS[key].url;
      return;
    }

    if (action === "gigs") {
      el.classList.add("center");
      body.innerHTML = "<p>Here's the work I've been part of.</p>" + feedHTML();
      bindFeed(body);
      el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      await wait(700);
      revealChips(AFTER_GIGS);   /* després del llistat: Offer a job / Ask for a job */
      return;
    }

    if (action === "milestones") {
      body.innerHTML = "<p>Here are the milestones that have marked my path, in chronological order.</p>" + milestonesHTML();
      el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      return;
    }

    /* whatsapp */
    body.innerHTML = "<p>Opening WhatsApp with your message…</p>";
    const p = document.createElement("p");
    const a = document.createElement("a");
    a.href = waUrl;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = opened ? "Didn't open? Tap here" : "Tap here to open WhatsApp";
    p.appendChild(a);
    body.appendChild(p);
    toBottom();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (send.disabled) return;

    const text = ta.value.trim();
    const key = matchKey(text);
    const action = key ? PROMPTS[key].action : "whatsapp";

    /* WhatsApp s'obre dins del clic perquè el navegador no el bloquegi */
    let waUrl = null, opened = false;
    if (action === "whatsapp") {
      waUrl = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text);
      const w = window.open(waUrl, "_blank");
      if (w) { w.opener = null; opened = true; }
    }

    app.dataset.state = "chat";
    addUser(text);
    ta.value = "";
    activeKey = null;
    resize();
    setActive(null);
    refresh();
    respond(action, waUrl, opened, key);
  });

  if (matchMedia("(hover: hover)").matches) ta.focus({ preventScroll: true });
})();
</script>
</body>
</html>
