  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      linear-gradient(rgba(0,0,0,.68), rgba(0,0,0,.68)),
      var(--photo) center 65% / cover no-repeat fixed,
      var(--bg);
    color: var(--fg);
    font-family: "Quicksand", "Nunito", "Varela Round", sans-serif;
  }

  /* ---------- Layout: del compositor centrat al xat ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: var(--pad);
  }

  .spacer-top    { flex: 1 1 0; }
  .spacer-bottom { flex: 1.15 1 0; }
  .thread        { flex: 0 1 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  .spacer-top, .spacer-bottom, .thread { transition: flex-grow .7s var(--ease); }

  .app[data-state="chat"] .spacer-top,
  .app[data-state="chat"] .spacer-bottom { flex-grow: 0; }
  .app[data-state="chat"] .thread        { flex-grow: 1; margin-bottom: .75rem; }

  .thread-inner {
    width: min(720px, 100%);
    margin: 0 auto;
    padding-block: .5rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  .dock {
    flex: none;
    width: min(720px, 100%);
    margin-inline: auto;
  }

  /* ---------- Compositor ---------- */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: .5rem;
    padding: .6rem .6rem .6rem 1.35rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 24px;
    transition: border-color .25s ease;
    animation: rise .9s var(--ease) .1s both;
  }
  .composer:focus-within { border-color: rgba(255, 255, 255, .7); }

  textarea {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    color: var(--fg);
    font: 400 clamp(1.05rem, 1.8vw, 1.25rem) / 1.5 "Quicksand", "Nunito", sans-serif;
    padding: .6rem 0;
    max-height: 9rem;
  }
  textarea::placeholder { color: #9a9a9a; }

  .send {
    position: relative;
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 16px;
    background: var(--fg);
    color: var(--bg);
    cursor: pointer;
    transition: opacity .25s ease, transform .25s var(--ease);
  }
  .send:disabled { opacity: .25; cursor: default; }
  .send:not(:disabled):hover { transform: translateY(-2px); }
  .send > svg { width: 22px; height: 22px; }

  /* Insígnia de WhatsApp: avisa que l'enviament sortirà de la web */
  .wa-badge {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #25D366;
    box-shadow: 0 0 0 2px #141414;
    opacity: 0;
    transform: scale(.4);
    pointer-events: none;
    transition: opacity .25s ease, transform .35s var(--ease);
  }
  .wa-badge svg { width: 13px; height: 13px; fill: #fff; }
  .send.wa .wa-badge { opacity: 1; transform: scale(1); }

  /* ---------- Prompts predefinits ---------- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .6rem;
    margin-top: 1rem;
  }

  .chip {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: .06em;
    color: var(--fg);
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 999px;
    padding: .5rem 1.2rem;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s var(--ease);
    animation: rise .8s var(--ease) calc(.35s + var(--i) * .08s) both;
  }
  .chip.late { animation-delay: calc(var(--i) * .12s); }
  .chip:hover { background: rgba(255, 255, 255, .14); border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip:focus-visible, .send:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* ---------- Missatges ---------- */
  .msg { animation: rise .6s var(--ease) both; }

  .msg.user { align-self: flex-end; max-width: min(80%, 34rem); }
  .bubble {
    background: rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 20px 20px 6px 20px;
    padding: .8rem 1.1rem;
    font-weight: 400;
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .who {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .6rem;
    font-family: "Oswald", sans-serif;
    font-weight: 500;
    font-size: .9rem;
    letter-spacing: .12em;
  }

  .avatar {
    width: 28px;
    height: 28px;
    flex: none;
    border-radius: 50%;
    background: var(--photo) 62.6% 32.2% / 350% no-repeat, #222;
    border: 1px solid rgba(255, 255, 255, .5);
  }
  .avatar.big { width: 64px; height: 64px; }

  .body { color: #e4e4e4; font-weight: 400; font-size: clamp(1rem, 1.6vw, 1.15rem); line-height: 1.6; }
  .body p + p { margin-top: .6rem; }
  .msg.center .who { justify-content: center; }
  .msg.center .body > p { text-align: center; }
  .body a { color: var(--fg); text-underline-offset: 4px; }

  /* Indicador d'escriptura */
  .typing { display: inline-flex; gap: 5px; padding-block: .5rem; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--fg);
    animation: blink 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }

  /* ---------- Gigs: feed estil Instagram ---------- */
  .feed {
    width: min(470px, 100%);
    margin: 1rem auto 0;
    background: rgba(8, 8, 8, .6);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 1.1rem 1.2rem;
    border-bottom: 1px solid var(--line);
  }
  .profile strong { display: block; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 1.25rem; letter-spacing: .04em; }
  .profile span.meta { display: block; color: var(--muted); font-size: .95rem; margin-top: .15rem; }

  .post { border-bottom: 1px solid var(--line); animation: rise .7s var(--ease) calc(var(--i) * .12s) both; }
  .post:last-child { border-bottom: 0; }

  .post-head { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; }
  .post-head .avatar { width: 34px; height: 34px; }
  .post-head > div { min-width: 0; }
  .post-head strong { display: block; font-weight: 500; font-size: .95rem; line-height: 1.2; }
  .post-head .go {
    margin-left: auto; flex: none;
    font-family: "Oswald", sans-serif; font-weight: 500; font-size: .85rem; letter-spacing: .08em;
    color: var(--fg); text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 1px;
    transition: border-color .25s ease;
  }
  .post-head .go:hover { border-bottom-color: var(--fg); }
  .post-head .go:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .post-head small { display: block; color: var(--muted); font-size: .8rem; }

  .media { display: block; position: relative; overflow: hidden; cursor: pointer; }
  .watch {
    position: absolute; left: 12px; bottom: 12px;
    font-family: "Oswald", sans-serif; font-weight: 500; font-size: .85rem; letter-spacing: .08em;
    color: var(--fg); text-decoration: none;
    background: rgba(0, 0, 0, .72); border: 1px solid rgba(255, 255, 255, .4); border-radius: 999px;
    padding: .4rem .9rem; transition: background .25s ease, color .25s ease;
  }
  .watch:hover { background: var(--fg); color: var(--bg); }
  .watch:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .media img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; user-select: none; -webkit-user-drag: none;
  }

  .tile {
    aspect-ratio: var(--ar, 1 / 1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.25rem;
    user-select: none;
    -webkit-user-select: none;
  }
  .tile-kicker { font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .1em; font-size: .85rem; text-transform: uppercase; opacity: .8; }
  .tile-title  { font-family: "Oswald", sans-serif; font-weight: 700; font-size: clamp(2rem, 9vw, 3.4rem); line-height: .95; letter-spacing: -.01em; text-transform: uppercase; }

  .tile-a { background: #fff; color: #000; }
  .tile-b { background-color: #0a0a0a;
            background-image:
              repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.1) 39px 40px),
              repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.1) 39px 40px); }
  .tile-c { background: radial-gradient(circle at 80% 20%, transparent 0 18%, rgba(255,255,255,.22) 18.4% 19%, transparent 19.4% 34%, rgba(255,255,255,.16) 34.4% 35%, transparent 35.4% 52%, rgba(255,255,255,.1) 52.4% 53%, transparent 53.4%), #151515; }
  .tile-d { background: #d9d9d9; color: #000; }

  .heart-pop {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    opacity: 0; color: var(--fg); mix-blend-mode: difference;
  }
  .heart-pop svg { width: 96px; height: 96px; fill: currentColor; }
  .heart-pop.go { animation: pop .8s var(--ease); }

  .actions { display: flex; justify-content: space-between; padding: .6rem .8rem 0; }
  .act {
    background: none; border: 0; color: var(--fg); cursor: pointer; padding: .35rem; display: grid; place-items: center;
    transition: transform .25s var(--ease);
  }
  .act:hover { transform: scale(1.1); }
  .act:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .act svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: fill .2s ease; }
  .act[aria-pressed="true"] svg { fill: currentColor; }
  .act.like[aria-pressed="true"] svg { animation: pop-small .35s var(--ease); }

  .likes { padding: .55rem 1rem 0; font-weight: 500; font-size: .92rem; }
  .tags { display: block; margin-top: .65rem; color: #9a9a9a; font-size: .9rem; letter-spacing: .01em; }
  .caption { padding: .4rem 1rem 1.2rem; font-size: .95rem; line-height: 1.5; color: #e4e4e4; }
  .caption .line { display: block; }
  .caption .line + .line { margin-top: .55rem; }
  .caption b { display: block; font-weight: 500; color: var(--fg); }
  .caption .meta { display: block; color: var(--muted); font-size: .88rem; }

  /* ---------- Milestones ---------- */
  .milestones { list-style: none; margin-top: 1rem; width: min(640px, 100%); }
  .milestones li {
    display: grid;
    grid-template-columns: clamp(5rem, 15vw, 7.5rem) 1fr;
    gap: 0 1.25rem;
    align-items: baseline;
    padding: 1.1rem 0;
    border-top: 1px solid var(--line);
    animation: rise .7s var(--ease) calc(var(--i) * .12s) both;
  }
  .milestones li:last-child { border-bottom: 1px solid var(--line); }
  .milestones .year { font-family: "Oswald", sans-serif; font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1; letter-spacing: -.01em; }
  .milestones .year.none { opacity: .35; }
  .milestones .name { display: block; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 1.25rem; letter-spacing: .03em; line-height: 1.25; }
  .milestones .note { display: block; color: var(--muted); font-size: 1rem; margin-top: .25rem; }

  .details {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: .35rem 1rem;
    margin-top: .9rem;
    font-size: .92rem;
    line-height: 1.45;
  }
  .details dt { color: var(--muted); }
  .details dd { color: #e4e4e4; }

  .ext {
    display: inline-block;
    margin-top: 1.1rem;
    font-family: "Oswald", sans-serif;
    font-weight: 500;
    font-size: .9rem;
    letter-spacing: .08em;
    color: var(--fg);
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, .4);
    border-radius: 999px;
    padding: .4rem 1.1rem;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .ext:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .ext:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* ---------- Animacions ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 80%, 100% { opacity: .2; }
    40%           { opacity: 1; }
  }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(.4); }
    25%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1); }
  }
  @keyframes pop-small {
    0% { transform: scale(.7); } 60% { transform: scale(1.25); } 100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .spacer-top, .spacer-bottom, .thread { transition: none; }
    .composer, .chip, .msg, .post, .milestones li { animation-name: fade; }
    .typing i { animation-duration: 2.4s; }
    .heart-pop.go { animation: none; }
    .act:hover, .send:not(:disabled):hover { transform: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  ::selection { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
  <main class="app" id="app" data-state="idle">

    <div class="dock">

        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          <span class="wa-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span>
        </button>
      </form>

      <div class="chips" id="chips" role="group" aria-label="Suggested prompts"></div>
    </div>

    <div class="spacer-bottom"></div>
  </main>

<script>
(() => {
  const WHATSAPP = "34626692782";
  const TRENDS_URL = "https://trends.bonafont.dev";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Prompts: text que es posa al camp i acció en enviar.
     action: "trends" (obre Trends), "link" (obre la url del prompt), "gigs", "milestones" (resposta al xat) o "whatsapp" (envia el text per WhatsApp) */
  const PROMPTS = {
    future:     { label: "Future",          action: "trends",     text: "What's next? Show me the trends shaping the future." },
    gigs:       { label: "Gigs",            action: "gigs",       text: "Show me the projects you've worked on." },
    milestones: { label: "Milestones",      action: "milestones", text: "Show me the milestones that have marked your path." },
    personal:   { label: "Personal",        action: "whatsapp",   text: "Hi! I'd love to get in touch with you personally. Can we talk?" },
    offer:      { label: "Offer a job",     action: "whatsapp",   text: "Hi! I have a job opportunity I'd like to offer you. Can we talk?" },
    ask:        { label: "Ask for a job",   action: "whatsapp",   text: "Hi! I'm looking for work. Is there a chance to join your team?" },
    mwc:        { label: "MWC tours",       action: "whatsapp",   text: "Tell me about the MWC tours." },
    uxsong:     { label: "UXccenture Song", action: "link",       text: "Take me to UXccenture Song.",
                  url: "https://dilemas.bonafont.dev", opening: "Opening UXccenture Song…" }
  };

  const INITIAL      = ["future", "gigs", "milestones", "personal"];
  const AFTER_FUTURE = ["mwc", "uxsong"];   /* apareixen en clicar el prompt Future */
  const AFTER_GIGS   = ["offer", "ask"];    /* apareixen després de mostrar els Gigs */

  /* ---- Contingut de "Gigs": edita aquesta llista amb els teus projectes ----
     id:     identificador únic (serveix per recordar "m'agrada" i "desats" en aquest navegador)
     img:    clau d'una imatge incrustada (objecte IMAGES, al final del script)
     mp4:    vídeo propi (carpeta media/) amb el seu poster; es reprodueix sol, en bucle i sense so
     video:  ID d'un vídeo de YouTube (autoplay, sense so)
     ratio:  proporció del suport (per defecte 1 / 1)
     tags:   hashtags del sector del client
     url:    pàgina del projecte (botó "View") */
  const SITE = "https://sites.google.com/view/scenarios-pw/projects/";
  const POSTS = [
    { id: "generalitat", client: "Generalitat de Catalunya", tile: "a", kicker: "iF Award 2026",
      url: "https://ifdesign.com/en/winner-ranking/project/reinventing-public-services/766988",
      img: "generalitat", ratio: "4 / 3", tags: ["publicsector"],
      items: [
        { title: "Reinventing Public Services", meta: "iF Award 2026" }
      ] },
    { id: "lms", client: "La Meva Salut", tile: "b", kicker: "Generalitat de Catalunya",
      mp4: "media/lms-ecosistema.mp4", poster: "media/lms-ecosistema.jpg", ratio: "16 / 9", tags: ["publicsector", "healthcare"],
      items: [
        { title: "Evolució de La Meva Salut", meta: "Digital health · Generalitat de Catalunya" }
      ] },
    { id: "cupra", client: "Cupra", tile: "d", kicker: "Accenture Song", url: SITE + "cupra",
      video: "a47VF8tQszI", ratio: "16 / 9", tags: ["automotive"],
      items: [
        { title: "MyCupra App Design", meta: "Project lead · Accenture Song" }
      ] },
    { id: "sabadell", client: "Banc Sabadell", tile: "c", kicker: "Accenture Song · RocaSalvatella", url: SITE + "banc-sabadell",
      mp4: "media/sabadell-tarjetas.mp4", poster: "media/sabadell-tarjetas.jpg", ratio: "16 / 9", tags: ["banking"],
      items: [
        { title: "New app design", meta: "Project lead · Accenture Song" },
        { title: "Hub Empresa",    meta: "OKR expert · RocaSalvatella" }
      ] },
    { id: "vw", client: "Volkswagen Group", tile: "b", kicker: "RocaSalvatella", url: SITE + "volkswagen-group",
      video: "V93ocN5Bpik", ratio: "16 / 9", tags: ["automotive"],
      items: [
        { title: "iLAB VGED",                     meta: "Project lead · RocaSalvatella" },
        { title: "Volkswagen Digital Experience", meta: "Project collaborator · RocaSalvatella" }
      ] },
    { id: "mango", client: "Mango", tile: "c", kicker: "Accenture Song", url: SITE + "mango",
      img: "mango", ratio: "1100 / 787", tags: ["retail"],
      items: [
        { title: "MANGO Online Vision",              meta: "Project lead · Accenture Song" },
        { title: "Digital Product Vision Statement", meta: "Project lead · Accenture Song" }
      ] },
    { id: "morabanc", client: "Morabanc", tile: "b", kicker: "Accenture Song", url: SITE + "morabanc",
      img: "morabanc", ratio: "1 / 1", tags: ["banking"],
      items: [
        { title: "Morabanc Digital Strategy", meta: "Project lead · Accenture Song" },
        { title: "New app design",            meta: "Project lead · Accenture Song" }
      ] },
    { id: "puig", client: "Puig", tile: "d", kicker: "Accenture Song", url: SITE + "puig",
      img: "puig", ratio: "1 / 1", tags: ["beauty"],
      items: [
        { title: "CX Team Operating Model",            meta: "Project lead · Accenture Song" },
        { title: "CX Operating Model Change strategy", meta: "Project lead · Accenture Song" }
      ] },
    { id: "acm", client: "ACM", tile: "b", kicker: "LLYC", url: SITE + "acm",
      img: "acm", ratio: "1 / 1", tags: ["publicsector"],
      items: [
        { title: "Guia xarxes socials per a càrrecs electes i ens locals", meta: "Project lead · LLYC" }
      ] },
    { id: "uoc", client: "UOC", tile: "c", kicker: "Accenture", url: SITE + "uoc",
      img: "uoc", ratio: "1 / 1", tags: ["publicsector"],
      items: [
        { title: "The future of Digital Consumption", meta: "Project lead · Accenture" }
      ] }
  ];

  /* ---- "M'agrada" i "desats": guardats en aquest navegador (localStorage) ----
     BASE_LIKES: m'agrada d'altres visitants. Un recompte compartit entre persones necessita un
     servidor; mentre no n'hi hagi, el recompte només inclou el m'agrada d'aquest navegador. */
  const BASE_LIKES = {};
  const mem = {};
  const store = {
    read(k) {
      try { return JSON.parse(localStorage.getItem(k)) || {}; }
      catch (e) { return mem[k] || {}; }
    },
    write(k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sense emmagatzematge: queda en memòria */ }
    }
  };
  let liked = store.read("bonafont.liked");
  let saved = store.read("bonafont.saved");
  const likeCount = (id) => (BASE_LIKES[id] || 0) + (liked[id] ? 1 : 0);
  const likeText = (n) => n === 0 ? "Be the first to like this" : n === 1 ? "1 like" : n + " likes";

  /* ---- Contingut de "Milestones", en ordre cronològic ----
     year: null mostra "—" (afegeix-hi l'any quan el sàpigues) */
  const MILESTONES = [
    { year: 2005, title: "Winner of the university oratory contest" },
    { year: 2011, title: "Co-author of the book “Freedoms of Expression and Information on the Internet and Social Networks: Exercise, Threats and Guarantees”" },
    { year: 2015, title: "Certified in Human Centered Design", note: "IDEO" },
    { year: null, title: "Verified Certificate · Impact Evaluation of Social Programs", note: "MITx" },
    { year: 2026, title: "iF Award", note: "Reinventing Public Services · Generalitat de Catalunya",
      details: [
        ["Award",       "iF DESIGN AWARD 2026"],
        ["Project",     "Reinventing Public Services"],
        ["Entity",      "Generalitat de Catalunya"],
        ["Organiser",   "iF Design"],
        ["Competition", "10,000+ entries from 70+ countries, 93 design categories"],
        ["Award night", "Berlin · 27 April 2026"]
      ],
      link: { href: "https://ifdesign.com/en/winner-ranking/project/reinventing-public-services/766988", label: "View on iF Design ↗" } }
  ];

  const ICONS = {
    heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
  };

  const app = document.getElementById("app");
  const thread = document.getElementById("thread");
  const inner = document.getElementById("threadInner");
  const form = document.getElementById("composer");
  const ta = document.getElementById("prompt");
  const send = document.getElementById("send");
  const chipsEl = document.getElementById("chips");

  let typing = false;
  let timer = null;
  let activeKey = null;

  /* YouTube només reprodueix incrustat si la pàgina té origen http(s) (no file:// ni iframes aïllats) */
  const CAN_EMBED = /^https?:$/.test(location.protocol) && location.origin !== "null";

  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? Math.min(ms, 150) : ms));
  const matchKey = (v) => Object.keys(PROMPTS).find((k) => PROMPTS[k].text === v.trim()) || null;

  /* ---------- Prompts (chips) ---------- */
  function addChip(key, i, late) {
    if (chipsEl.querySelector('[data-key="' + key + '"]')) return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (late ? " late" : "");
    b.dataset.key = key;
    b.setAttribute("aria-pressed", "false");
    b.style.setProperty("--i", i);
    b.textContent = PROMPTS[key].label;
    chipsEl.appendChild(b);
  }
  function revealChips(keys) { keys.forEach((k, i) => addChip(k, i, true)); }
  INITIAL.forEach((k, i) => addChip(k, i, false));

  function setActive(key) {
    chipsEl.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.key === key)));
  }

  /* ---------- Camp d'entrada ---------- */
  function refresh() {
    const has = ta.value.trim() !== "";
    send.disabled = typing || !has;
    /* Mentre s'escriu el prompt, la destinació és la de la xip activa */
    const key = typing ? activeKey : matchKey(ta.value);
    const action = key ? PROMPTS[key].action : "whatsapp";   /* text lliure => WhatsApp */
    const toWhatsApp = has && action === "whatsapp";
    send.classList.toggle("wa", toWhatsApp);
    send.setAttribute("aria-label", toWhatsApp ? "Send via WhatsApp" : "Send");
  }
  function resize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 144) + "px"; }

  /* El prompt s'escriu al camp com si l'usuari el tecleges */
  function typeInto(text) {
    clearInterval(timer);
    if (reduceMotion) { ta.value = text; typing = false; resize(); refresh(); return; }
    typing = true;
    ta.value = "";
    refresh();
    let i = 0;
    timer = setInterval(() => {
      i = Math.min(text.length, i + 2);
      ta.value = text.slice(0, i);
      resize();
      if (i >= text.length) { clearInterval(timer); typing = false; }
      refresh();
    }, 16);
  }

  chipsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const key = chip.dataset.key;
    activeKey = key;
    setActive(key);
    typeInto(PROMPTS[key].text);
    if (key === "future") revealChips(AFTER_FUTURE);
    if (matchMedia("(hover: hover)").matches) ta.focus({ preventScroll: true });
  });

  /* Si l'usuari edita el text, el prompt deixa de ser el predefinit */
  ta.addEventListener("input", () => {
    clearInterval(timer);
    typing = false;
    activeKey = matchKey(ta.value);
    setActive(activeKey);
    resize();
    refresh();
  });

  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });

  /* ---------- Missatges ---------- */
  function toBottom() { thread.scrollTo({ top: thread.scrollHeight, behavior: reduceMotion ? "auto" : "smooth" }); }

  function addUser(text) {
    const el = document.createElement("div");
    el.className = "msg user";
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    el.appendChild(b);
    inner.appendChild(el);
    toBottom();
  }

  function addBot() {
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML =
      '<div class="who"><span class="avatar" aria-hidden="true"></span><span class="name">BONAFONT</span></div>' +
      '<div class="body"><div class="typing" aria-label="Typing"><i></i><i></i><i></i></div></div>';
    inner.appendChild(el);
    toBottom();
    return { el, body: el.querySelector(".body") };
  }

  /* ---------- Gigs (feed) ---------- */
  function feedHTML() {
    const posts = POSTS.map((p, i) => {
      const tile = '<div class="tile tile-' + p.tile + '"><span class="tile-kicker">' + p.kicker + '</span><span class="tile-title">' + p.client + '</span></div>';
      const ratio = p.ratio || "1 / 1";
      let media = "";
      if (p.video) {
        /* pòster de YouTube mentre carrega (i per a qui prefereix menys moviment) */
        media = '<img src="https://i.ytimg.com/vi/' + p.video + '/mqdefault.jpg" alt="" referrerpolicy="no-referrer" draggable="false">';
        if (CAN_EMBED) {
          /* vídeo en bucle sense so */
          media += '<iframe data-src="https://www.youtube-nocookie.com/embed/' + p.video + '?autoplay=1&mute=1&loop=1&playlist=' + p.video +
            '&controls=0&playsinline=1&modestbranding=1&rel=0&disablekb=1&iv_load_policy=3" title="' + p.client + ' video" ' +
            'allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1" aria-hidden="true"></iframe>';
        } else {
          /* sense origen http(s) YouTube dóna l'error 153: s'ofereix un enllaç en lloc del reproductor */
          media += '<a class="watch" href="https://www.youtube.com/watch?v=' + p.video + '" target="_blank" rel="noopener">▶ Watch on YouTube</a>';
        }
      } else if (p.mp4) {
        /* vídeo propi: sense so, en bucle; es reprodueix només quan es veu */
        media = '<video muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true" tabindex="-1" poster="' + p.poster + '" src="' + p.mp4 + '"></video>';
      } else if (p.img && IMAGES[p.img]) {
        media = '<img src="' + IMAGES[p.img] + '" alt="' + p.client + '" draggable="false">';
      }
      const lines = p.items.map((x) =>
        '<span class="line"><b>' + x.title + '</b><span class="meta">' + x.meta + '</span></span>').join("");
      const view = p.url ? '<a class="go" href="' + p.url + '" target="_blank" rel="noopener">View ↗</a>' : "";
      const tags = p.tags ? '<span class="tags">' + p.tags.map((t) => '#' + t).join(" ") + '</span>' : "";
      const isLiked = !!liked[p.id], isSaved = !!saved[p.id];
      return '<article class="post" data-id="' + p.id + '" style="--i:' + i + '">' +
        '<div class="post-head"><span class="avatar" aria-hidden="true"></span><div><strong>bonafont</strong><small>' + p.client + '</small></div>' + view + '</div>' +
        '<div class="media" data-dbl style="--ar:' + ratio + '"' + (p.video || p.mp4 ? ' data-video' : '') + '>' + tile + media + '<span class="heart-pop">' + ICONS.heart + '</span></div>' +
        '<div class="actions">' +
          '<button class="act like" type="button" aria-pressed="' + isLiked + '" aria-label="Like">' + ICONS.heart + '</button>' +
          '<button class="act save" type="button" aria-pressed="' + isSaved + '" aria-label="' + (isSaved ? "Saved" : "Save") + '">' + ICONS.bookmark + '</button>' +
        '</div>' +
        '<p class="likes">' + likeText(likeCount(p.id)) + '</p>' +
        '<p class="caption">' + lines + tags + '</p>' +
      '</article>';
    }).join("");

    return '<div class="feed">' +
      '<header class="profile"><span class="avatar big" aria-hidden="true"></span>' +
      '<div><strong>bonafont</strong><span class="meta">' + POSTS.length + ' projects</span></div></header>' +
      posts + '</div>';
  }

  function bindFeed(root) {
    root.addEventListener("error", (e) => { if (e.target.tagName === "IMG") e.target.remove(); }, true);

    /* Vídeos: es carreguen/reprodueixen en entrar a pantalla i s'aturen en sortir */
    const videos = [...root.querySelectorAll("[data-video]")].filter((v) => v.querySelector("iframe, video"));
    if (videos.length && !reduceMotion && "IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          const vid = en.target.querySelector("video");
          if (vid) {
            if (en.isIntersecting) { const pr = vid.play(); if (pr && pr.catch) pr.catch(() => {}); }
            else vid.pause();
            return;
          }
          const f = en.target.querySelector("iframe");
          const on = f.getAttribute("src") && f.getAttribute("src") !== "about:blank";
          if (en.isIntersecting && !on) f.setAttribute("src", f.dataset.src);
          else if (!en.isIntersecting && on) f.setAttribute("src", "about:blank");
        });
      }, { root: thread, threshold: 0.25 });
      videos.forEach((v) => io.observe(v));
    }

    /* M'agrada: s'actualitza el botó, el recompte i es recorda en aquest navegador */
    const setLike = (post, on) => {
      const id = post.dataset.id;
      if (on) liked[id] = true; else delete liked[id];
      store.write("bonafont.liked", liked);
      post.querySelector(".like").setAttribute("aria-pressed", String(on));
      post.querySelector(".likes").textContent = likeText(likeCount(id));
    };
    /* Desat: es guarda als favorits d'aquest navegador */
    const setSave = (post, on) => {
      const id = post.dataset.id;
      if (on) saved[id] = true; else delete saved[id];
      store.write("bonafont.saved", saved);
      const b = post.querySelector(".save");
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", on ? "Saved" : "Save");
    };

    root.addEventListener("click", (e) => {
      const btn = e.target.closest(".act");
      if (!btn) return;
      const post = btn.closest(".post");
      const on = btn.getAttribute("aria-pressed") !== "true";
      if (btn.classList.contains("like")) setLike(post, on); else setSave(post, on);
    });
    root.addEventListener("dblclick", (e) => {
      const media = e.target.closest("[data-dbl]");
      if (!media) return;
      setLike(media.closest(".post"), true);
      const pop = media.querySelector(".heart-pop");
      pop.classList.remove("go");
      void pop.offsetWidth;
      pop.classList.add("go");
    });
  }

  /* ---------- Milestones ---------- */
  function milestonesHTML() {
    return '<ul class="milestones">' + MILESTONES.map((m, i) => {
      const year = '<span class="year' + (m.year ? "" : " none") + '">' + (m.year || "—") + '</span>';
      const note = m.note ? '<span class="note">' + m.note + '</span>' : "";
      const det = m.details
        ? '<dl class="details">' + m.details.map((d) => '<dt>' + d[0] + '</dt><dd>' + d[1] + '</dd>').join("") + '</dl>'
        : "";
      const link = m.link ? '<a class="ext" href="' + m.link.href + '" target="_blank" rel="noopener">' + m.link.label + '</a>' : "";
      return '<li style="--i:' + i + '">' + year + '<div class="what"><span class="name">' + m.title + '</span>' + note + det + link + '</div></li>';
    }).join("") + '</ul>';
  }

  /* ---------- Resposta segons l'acció ---------- */
  async function respond(action, waUrl, opened, key) {
    const { el, body } = addBot();
    await wait(action === "gigs" || action === "milestones" ? 900 : 700);

    if (action === "trends") {
      body.innerHTML = "<p>Opening Bonafont Trends…</p>";
      toBottom();
      await wait(900);
      location.href = TRENDS_URL;
      return;
    }

    if (action === "link") {
      body.innerHTML = "<p>" + PROMPTS[key].opening + "</p>";
      toBottom();
      await wait(900);
      location.href = PROMPTS[key].url;
      return;
    }

    if (action === "gigs") {
      el.classList.add("center");
      body.innerHTML = "<p>Here's the work I've been part of.</p>" + feedHTML();
      bindFeed(body);
      el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      await wait(700);
      revealChips(AFTER_GIGS);   /* després del llistat: Offer a job / Ask for a job */
      return;
    }

    if (action === "milestones") {
      body.innerHTML = "<p>Here are the milestones that have marked my path, in chronological order.</p>" + milestonesHTML();
      el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      return;
    }

    /* whatsapp */
    body.innerHTML = "<p>Opening WhatsApp with your message…</p>";
    const p = document.createElement("p");
    const a = document.createElement("a");
    a.href = waUrl;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = opened ? "Didn't open? Tap here" : "Tap here to open WhatsApp";
    p.appendChild(a);
    body.appendChild(p);
    toBottom();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (send.disabled) return;

    const text = ta.value.trim();
    const key = matchKey(text);
    const action = key ? PROMPTS[key].action : "whatsapp";

    /* WhatsApp s'obre dins del clic perquè el navegador no el bloquegi */
    let waUrl = null, opened = false;
    if (action === "whatsapp") {
      waUrl = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text);
      const w = window.open(waUrl, "_blank");
      if (w) { w.opener = null; opened = true; }
    }

    app.dataset.state = "chat";
    addUser(text);
    ta.value = "";
    activeKey = null;
    resize();
    setActive(null);
    refresh();
    respond(action, waUrl, opened, key);
  });
